services:
  - type: web
    name: vigilai-backend
    env: docker
    region: ohio # Adjust if necessary, ohio is standard US east
    plan: free # Change to starter if you upgrade
    dockerfilePath: Dockerfile
    rootDir: backend
    healthCheckPath: /docs
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "postgres"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
